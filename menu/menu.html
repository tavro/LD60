<div class="game-menu">
  <div class="menu-content" id="main-panel">
    <p class="subtitle">WELCOME BACK, PLAYER</p>

    <h1>VOID PROTOCOL</h1>

    <nav class="menu-options">
      <button id="play">▶ PLAY GAME</button>
      <button id="settings">⚙ SETTINGS</button>
      <button id="exit">✕ EXIT</button>
    </nav>
  </div>
  <div class="menu-content" id="settings-panel" hidden>
    <h1>SETTINGS</h1>

    <label for="volume">Volume</label>
    <input id="volume" type="range"
           min="0" max="1" step="0.01" />

    <label for="brightness">Brightness</label>
    <input id="brightness" type="range"
           min="0.5" max="1.5" step="0.05" />

    <button id="settings-back">BACK</button>
  </div>
</div>
