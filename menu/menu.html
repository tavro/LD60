<div class="game-menu">
  <div class="menu-content" id="main-panel">
    <h1>SHELF LIFE</h1>

    <nav class="menu-options">
      <button id="play" data-icon="play">Start shift</button>
      <button id="tutorial" data-icon="help">How to play</button>
      <button id="skip-tutorial" data-icon="skip" hidden>Skip tutorial</button>
      <button id="settings" data-icon="settings">Settings</button>
    </nav>
  </div>
  <div class="menu-content" id="settings-panel" hidden>
    <h1>SETTINGS</h1>

    <label for="volume">Volume</label>
    <input id="volume" type="range"
           min="0" max="1" step="0.01" />
		   
    <label for="sfx-volume">SFX Volume</label>
    <input id="sfx-volume" type="range"
           min="0" max="1" step="0.01" />

    <label for="brightness">Brightness</label>
    <input id="brightness" type="range"
           min="0.5" max="1.5" step="0.05" />

    <label for="mouse-sensitivity">Mouse sensitivity</label>
    <input id="mouse-sensitivity" type="range"
           min="0.25" max="3" step="0.05" />

    <button id="settings-back" data-icon="back">Back</button>
  </div>
  <div class="menu-content" id="shift-panel" hidden>
    <h1 id="shift-title"></h1>
    <ul id="shift-summary"></ul>
    <div id="shift-upgrades"></div>
    <button id="shift-continue" data-icon="play"></button>
  </div>
</div>
